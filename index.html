<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuncay Ailesi Soy Ağacı</title>

  <style>
    body{
      margin:0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(to bottom, #1f4d4d, #081818);
      color:#f5efe1;
    }

    h1{
      text-align:center;
      color:#d4af37;
      letter-spacing:2px;
      margin:30px 10px 50px;
    }

    /* Allgemeine Struktur */
    .tree{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:60px;
      padding-bottom:80px;
    }

    .level{
      display:flex;
      justify-content:center;
      gap:40px;
      flex-wrap:wrap;
      position:relative;
    }

    /* Karten */
    .card{
      background: rgba(245,239,225,0.1);
      border:1px solid rgba(212,175,55,0.6);
      border-radius:16px;
      padding:14px 18px;
      min-width:220px;
      text-align:center;
      box-shadow:0 12px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      position:relative;
    }

    .name{
      font-weight:700;
      font-size:15px;
    }

    /* Ehepaar */
    .couple{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .dash{
      font-size:26px;
      color:#d4af37;
      font-weight:300;
    }

    /* Verbindungslinien */
    .vertical-line{
      width:2px;
      height:40px;
      background:#d4af37;
      margin:0 auto;
    }

    .children{
      display:flex;
      gap:40px;
      flex-wrap:wrap;
      justify-content:center;
      position:relative;
    }

    .children::before{
      content:"";
      position:absolute;
      top:-20px;
      left:0;
      right:0;
      height:2px;
      background:#d4af37;
      margin:auto;
      width:80%;
    }

    .child{
      position:relative;
    }

    .child::before{
      content:"";
      position:absolute;
      top:-20px;
      left:50%;
      transform:translateX(-50%);
      width:2px;
      height:20px;
      background:#d4af37;
    }

    footer{
      text-align:center;
      font-size:12px;
      opacity:.6;
      margin-top:40px;
    }

    @media (max-width:600px){
      .children::before{ width:90%; }
    }
  </style>
</head>

<body>

<h1>Tuncay Ailesi Soy Ağacı</h1>

<div class="tree">

  <!-- EHEPAAR -->
  <div class="level">
    <div class="couple">
      <div class="card">
        <div class="name">Hasan Orhan Tuncay</div>
      </div>
      <div class="dash">—</div>
      <div class="card">
        <div class="name">Neriman Tuncay</div>
      </div>
    </div>
  </div>

  <div class="vertical-line"></div>

  <!-- KINDER -->
  <div class="level">
    <div class="children">

      <!-- Niyazi -->
      <div class="child">
        <div class="card">
          <div class="name">Niyazi Tuncay</div>
          <div style="margin-top:6px;font-size:13px;opacity:.85;">
            Eşi: Derya Tuncay
          </div>
        </div>

        <div class="vertical-line"></div>

        <div class="children">
          <div class="child">
            <div class="card">
              <div class="name">Fatih Eren Tuncay</div>
            </div>
          </div>

          <div class="child">
            <div class="card">
              <div class="name">Asya Tuncay</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Ülkü -->
      <div class="child">
        <div class="card">
          <div class="name">Ülkü Efe</div>
          <div style="margin-top:6px;font-size:13px;opacity:.85;">
            Eşi: Ertan Efe
          </div>
        </div>

        <div class="vertical-line"></div>

        <div class="children">
          <div class="child">
            <div class="card">
              <div class="name">Hamza Ali Efe</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Ur -->
      <div class="child">
        <div class="card">
          <div class="name">Ugur Tuncay</div>
        </div>
      </div>

      <!-- Hakan -->
      <div class="child">
        <div class="card">
          <div class="name">Hakan Ali Tuncay</div>
        </div>
      </div>

    </div>
  </div>

</div>

<footer>
  ✶ Nesiller, bir nehir gibi birbirine akar ✶
</footer>

</body>
</html>
