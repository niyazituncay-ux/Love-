<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tuncay Ailesi Soy Ağacı (Almanya)</title>

  <style>
    :root{
      --bg1:#1f4d4d;
      --bg2:#081818;
      --ivory:#f5efe1;
      --gold:#d4af37;
      --card: rgba(245,239,225,0.10);
      --card2: rgba(245,239,225,0.14);
      --line: rgba(212,175,55,0.55);
      --shadow: 0 10px 22px rgba(0,0,0,0.30);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: linear-gradient(to bottom, var(--bg1), var(--bg2));
      color: var(--ivory);
      overflow:hidden; /* one-glance */
    }

    header{
      padding: 12px 10px 10px;
      text-align:center;
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
      background: rgba(8,24,24,0.72);
      border-bottom: 1px solid rgba(212,175,55,0.20);
      z-index: 20;
    }
    h1{
      margin:0;
      color: var(--gold);
      letter-spacing: .9px;
      font-size: 17px;
    }
    .meta{
      margin-top: 8px;
      display:flex;
      gap:8px;
      justify-content:center;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      border: 1px solid rgba(212,175,55,0.55);
      background: rgba(0,0,0,0.18);
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      user-select:none;
    }
    .btn{
      border:1px solid rgba(212,175,55,0.55);
      background: rgba(0,0,0,0.18);
      color: var(--ivory);
      padding: 6px 8px;
      border-radius: 10px;
      cursor:pointer;
      font-weight:900;
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
      user-select:none;
    }
    .btn:hover{ background: rgba(245,239,225,0.10); }
    .btn.primary{
      background: linear-gradient(180deg, rgba(212,175,55,0.24), rgba(212,175,55,0.12));
      border-color: rgba(212,175,55,0.75);
    }
    .btn.danger{
      border-color: rgba(255,120,120,0.55);
      background: rgba(255,120,120,0.10);
    }

    /* Viewport: fit-to-screen stage */
    .viewport{
      height: calc(100vh - 70px);
      padding: 10px;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }
    .stage{
      transform-origin: top left;
      display:inline-block;
      position: relative;
    }

    /* SVG lines */
    #lines{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index: 0;
    }

    /* Nodes layer */
    #nodes{
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    /* Node style (compact) */
    .node{
      position:absolute;
      width: 190px;          /* kleiner */
      padding: 8px 9px;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--card2), var(--card));
      border: 1px solid rgba(212,175,55,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      text-align:center;
    }
    .node::before{
      content:"✶";
      position:absolute;
      top:-10px;
      left:50%;
      transform:translateX(-50%);
      color: var(--gold);
      font-size: 14px;
      background: rgba(8,24,24,0.95);
      padding: 0 6px;
      border-radius: 10px;
    }
    .name{
      font-weight: 950;
      font-size: 12px;
      line-height: 1.15;
      word-break: break-word;
    }
    .sub{
      margin-top: 4px;
      font-size: 10.5px;
      opacity: .88;
      line-height: 1.2;
      word-break: break-word;
    }
    .actions{
      margin-top: 7px;
      display:flex;
      justify-content:center;
      gap:6px;
      flex-wrap:wrap;
    }

    .hint{
      position:absolute;
      right: 10px;
      bottom: 10px;
      font-size: 11px;
      opacity: .7;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(212,175,55,0.25);
      padding: 6px 8px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      user-select:none;
    }
  </style>
</head>

<body>
  <header>
    <h1>Tuncay Ailesi Soy Ağacı (Almanya)</h1>
    <div class="meta">
      <span class="pill" id="countPill">Toplam üye sayısı: …</span>
      <button class="btn" id="fitBtn" type="button">Ekrana Sığdır</button>
      <button class="btn primary" id="resetBtn" type="button">Bu cihazda kaydı sıfırla</button>
    </div>
  </header>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <svg id="lines"></svg>
      <div id="nodes"></div>
    </div>
    <div class="hint">İpucu: “Ekrana Sığdır” ile tamamı tek bakışta.</div>
  </div>

  <script>
    // ------------------ DATA (DÜZELTİLMİŞ) ------------------

              ]
            },
            {

              children: [
                { id: "hamza", person: "Hamza Ali Efe", spouse: "", note: "", children: [] }
              ]
            },
            {
              id: "ugur",
              person: "Uğur Tuncay",
              spouse: "Tuğba Tuncay Yumuşakgeyle",
              note: "",
              children: []
            },
            { id: "hakan", person: "Hakan Ali Tuncay", spouse: "", note: "", children: [] }
          ]
        },
        {
          id: "sev",
          person: "Sevda Tuncay",
          spouse: "Ahmed Tuncay",
          note: "",
          children: [
            {
              id: "bur",
              person: "Burhan Tuncay",
              spouse: "Adalet Tuncay",
              note: "",
              children: [
                { id: "burc1", person: "— En büyük çocuk (manuel)", spouse: "", note: "", children: [] },
                { id: "mirac", person: "Miraç Ahmed Tuncay", spouse: "", note: "", children: [] }
              ]
            },
            {
              id: "tubaTop",
              person: "Tuba Topal",
              spouse: "Cian Topal",
              note: "",
              children: [
                { id: "malik", person: "Malik Topal", spouse: "", note: "", children: [] }
              ]
            },
            {
              id: "asli",
              person: "Aslı Tuncay",
              spouse: "— (manuel girilecek)",
              note: "",
              children: [
                { id: "aslic1", person: "— Çocuk (manuel)", spouse: "", note: "", children: [] }
              ]
            }
          ]
        },
        {
          id: "cemal",
          person: "Cemal Tuncay",
          spouse: "Agnieszka Tuncay",
          note: "",
          children: [
            { id: "lara", person: "Lara Tuncay", spouse: "", note: "", children: [] }
          ]
        },
        {
          id: "fatih",
          person: "Fatih Tuncay",
          spouse: "Tatjana Tuncay",
          note: "Boşanmış",
          children: [
            { id: "senay", person: "Şenay Tuncay", spouse: "", note: "", children: [] },
            { id: "cemalf", person: "Cemal Tuncay", spouse: "", note: "", children: [] },
            { id: "esra", person: "Esra Tuncay", spouse: "", note: "", children: [] },
            { id: "sami", person: "Sami Yusuf Tuncay", spouse: "", note: "", children: [] }
          ]
        }
      ]
    };

    const STORAGE_KEY = "tuncay_family_de_generations_v1";

    function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
    function loadTree(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return clone(DEFAULT_TREE);
        return JSON.parse(raw);
      }catch(e){ return clone(DEFAULT_TREE); }
    }
    function saveTree(tree){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tree)); }

    function isRealName(name){
      if(!name) return false;
      const t = String(name).trim();
      if(!t) return false;
      if(t.startsWith("—")) return false;
      return true;
    }
    function countMembers(node){
      let c=0;
      if(isRealName(node.person)) c++;
      if(isRealName(node.spouse)) c++;
      for(const ch of (node.children||[])) c += countMembers(ch);
      return c;
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function newId(){ return "id_" + Math.random().toString(16).slice(2); }

    function findNodeAndParent(node, id, parent=null){
      if(node.id === id) return { node, parent };
      for(const ch of (node.children||[])){
        const found = findNodeAndParent(ch, id, node);
        if(found) return found;
      }
      return null;
    }

    // -------- Actions (everywhere) --------
    function editNode(tree, id){
      const found = findNodeAndParent(tree, id);
      if(!found) return;
      const node = found.node;

      const p = prompt("Kişi adı (person):", node.person ?? "");
      if(p === null) return;

      const s = prompt("Eş adı (spouse) — boş bırakabilirsin:", node.spouse ?? "");
      if(s === null) return;

      const n = prompt("Not (örn. Boşanmış) — boş bırakabilirsin:", node.note ?? "");
      if(n === null) return;

      node.person = p;
      node.spouse = s;
      node.note = n;
      saveTree(tree);
      render(tree);
    }

    function addSpouse(tree, id){
      const found = findNodeAndParent(tree, id);
      if(!found) return;
      const node = found.node;

      const s = prompt("Eş adı (spouse):", node.spouse ?? "");
      if(s === null) return;

      node.spouse = s;
      saveTree(tree);
      render(tree);
    }

    function addChild(tree, parentId){
      const found = findNodeAndParent(tree, parentId);
      if(!found) return;
      const parent = found.node;

      parent.children = parent.children || [];
      parent.children.push({ id:newId(), person:"— Yeni kişi (manuel)", spouse:"", note:"", children:[] });
      saveTree(tree);
      render(tree);
    }

    function addParentsAbove(tree, id){
      const found = findNodeAndParent(tree, id);
      if(!found) return;

      const target = found.node;
      const parent = found.parent;

      const parentPerson = prompt("Ebeveyn (anne/baba) kişi adı:", "— Yeni ebeveyn (manuel)");
      if(parentPerson === null) return;

      const parentSpouse = prompt("Diğer ebeveyn / eş adı (opsiyonel):", "");
      if(parentSpouse === null) return;

      const wrapper = { id:newId(), person:parentPerson, spouse:parentSpouse, note:"", children:[target] };

      if(!parent){
        tree = wrapper;
      }else{
        const idx = (parent.children||[]).findIndex(x => x.id === target.id);
        if(idx >= 0) parent.children[idx] = wrapper;
      }
      saveTree(tree);
      render(tree);
    }

    function deleteNode(tree, id){
      const found = findNodeAndParent(tree, id);
      if(!found) return;
      if(!found.parent){
        alert("Kök kişi silinemez.");
        return;
      }
      const ok = confirm("Silinsin mi? (Alt dallar da silinir)");
      if(!ok) return;
      found.parent.children = (found.parent.children||[]).filter(ch => ch.id !== id);
      saveTree(tree);
      render(tree);
    }

    // -------- Layout: Generations (columns) --------
    const NODE_W = 190, NODE_H = 86; // approx; we'll measure after render too
    const COL_GAP = 110;
    const ROW_GAP = 30;
    const PAD = 20;

    function label(node){
      let t = (node.person||"").trim() || "(isimsiz)";
      if((node.spouse||"").trim()) t += " — " + node.spouse.trim();
      return t;
    }

    function collectByDepth(root){
      const cols = [];
      function walk(n, d){
        if(!cols[d]) cols[d] = [];
        cols[d].push(n);
        for(const ch of (n.children||[])) walk(ch, d+1);
      }
      walk(root, 0);
      return cols;
    }

    function layoutPositions(root){
      // Simple, stable: place nodes column by column, top-down
      // Then, try to center parents over children by one refinement pass.
      const cols = collectByDepth(root);

      const pos = new Map(); // id -> {x,y,w,h}
      // initial placement
      for(let d=0; d<cols.length; d++){
        const x = PAD + d*(NODE_W + COL_GAP);
        for(let i=0; i<cols[d].length; i++){
          const y = PAD + i*(NODE_H + ROW_GAP);
          pos.set(cols[d][i].id, {x,y,w:NODE_W,h:NODE_H});
        }
      }

      // refinement: center each parent to its children average y
      function refine(n){
        const kids = n.children||[];
        if(kids.length){
          kids.forEach(refine);
          const ys = kids.map(k => (pos.get(k.id).y + NODE_H/2));
          const avg = ys.reduce((a,b)=>a+b,0)/ys.length;
          const p = pos.get(n.id);
          p.y = avg - NODE_H/2;
        }
      }
      refine(root);

      // After refine, prevent overlaps inside each column (simple sweep)
      for(let d=0; d<cols.length; d++){
        const ids = cols[d].map(n => n.id);
        ids.sort((a,b)=>pos.get(a).y - pos.get(b).y);

        let currentY = PAD;
        for(const id of ids){
          const p = pos.get(id);
          if(p.y < currentY) p.y = currentY;
          currentY = p.y + NODE_H + ROW_GAP;
        }
      }

      // compute bounds
      let maxX=0, maxY=0;
      for(const v of pos.values()){
        maxX = Math.max(maxX, v.x + v.w);
        maxY = Math.max(maxY, v.y + v.h);
      }
      return {pos, width:maxX+PAD, height:maxY+PAD};
    }

    function drawLines(tree, pos, width, height){
      const svg = document.getElementById("lines");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      svg.innerHTML = "";

      // defs (soft glow)
      svg.insertAdjacentHTML("beforeend", `
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.2" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
      `);

      function line(x1,y1,x2,y2){
        const path = document.createElementNS("http://www.w3.org/2000/svg","path");
        const midX = (x1+x2)/2;
        // smooth cubic
        const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
        path.setAttribute("d", d);
        path.setAttribute("fill","none");
        path.setAttribute("stroke", "rgba(212,175,55,0.50)");
        path.setAttribute("stroke-width","2");
        path.setAttribute("filter","url(#glow)");
        path.setAttribute("stroke-linecap","round");
        svg.appendChild(path);
      }

      function walk(n){
        const p = pos.get(n.id);
        const x1 = p.x + p.w;
        const y1 = p.y + p.h/2;

        for(const ch of (n.children||[])){
          const c = pos.get(ch.id);
          const x2 = c.x;
          const y2 = c.y + c.h/2;
          line(x1, y1, x2, y2);
          walk(ch);
        }
      }
      walk(tree);
    }

    // -------- Render nodes --------
    function nodeHTML(node){
      return `
        <div class="node" data-node="${node.id}">
          <div class="name">${escapeHtml(label(node))}</div>
          ${node.note ? `<div class="sub">${escapeHtml(node.note)}</div>` : ""}

          <div class="actions">
            <button class="btn" data-action="edit" data-id="${node.id}" type="button">✎</button>
            <button class="btn" data-action="spouse" data-id="${node.id}" type="button">+Eş</button>
            <button class="btn primary" data-action="add" data-id="${node.id}" type="button">+Çocuk</button>
            <button class="btn" data-action="parents" data-id="${node.id}" type="button">+Ebeveyn</button>
            <button class="btn danger" data-action="del" data-id="${node.id}" type="button">🗑</button>
          </div>
        </div>
      `;
    }

    function flatten(root){
      const arr = [];
      (function walk(n){
        arr.push(n);
        for(const ch of (n.children||[])) walk(ch);
      })(root);
      return arr;
    }

    function render(tree){
      document.getElementById("countPill").textContent = `Toplam üye sayısı: ${countMembers(tree)}`;

      const {pos, width, height} = layoutPositions(tree);

      const nodes = document.getElementById("nodes");
      nodes.style.width = width + "px";
      nodes.style.height = height + "px";

      const all = flatten(tree);
      nodes.innerHTML = all.map(nodeHTML).join("");

      // position nodes
      nodes.querySelectorAll(".node").forEach(el => {
        const id = el.getAttribute("data-node");
        const p = pos.get(id);
        el.style.left = p.x + "px";
        el.style.top = p.y + "px";
      });

      // draw lines behind
      drawLines(tree, pos, width, height);

      // bind actions
      nodes.querySelectorAll("button[data-action]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          let t = loadTree();
          if(action === "edit") editNode(t, id);
          if(action === "spouse") addSpouse(t, id);
          if(action === "add") addChild(t, id);
          if(action === "parents") addParentsAbove(t, id);
          if(action === "del") deleteNode(t, id);
        });
      });

      requestAnimationFrame(() => fitToScreen());
    }

    // -------- Auto-Fit (one glance) --------
    function fitToScreen(){
      const viewport = document.getElementById("viewport");
      const stage = document.getElementById("stage");

      stage.style.transform = "scale(1)";
      stage.style.transformOrigin = "top left";

      const vW = viewport.clientWidth;
      const vH = viewport.clientHeight;

      const rect = stage.getBoundingClientRect();
      const cW = rect.width;
      const cH = rect.height;

      const pad = 8;
      let s = Math.min((vW - pad)/cW, (vH - pad)/cH);
      s = Math.min(s, 1);
      s = Math.max(s, 0.12); // allow very small fit if many members

      stage.style.transform = `scale(${s})`;
    }

    // -------- Init & Controls --------
    let TREE = loadTree();
    render(TREE);

    document.getElementById("fitBtn").addEventListener("click", () => fitToScreen());
    window.addEventListener("resize", () => fitToScreen());

    document.getElementById("resetBtn").addEventListener("click", () => {
      if(confirm("Bu cihazdaki kaydedilen değişiklikler sıfırlansın mı?")){
        localStorage.removeItem(STORAGE_KEY);
        TREE = loadTree();
        render(TREE);
      }
    });
  </script>
</body>
