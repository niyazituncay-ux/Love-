<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tuncay Ailesi Soy Ağacı (Almanya)</title>

  <style>
    :root{
      --bg1:#1f4d4d;
      --bg2:#081818;
      --ivory:#f5efe1;
      --gold:#d4af37;
      --card: rgba(245,239,225,0.10);
      --card2: rgba(245,239,225,0.14);
      --line: rgba(212,175,55,0.85);
      --shadow: 0 10px 24px rgba(0,0,0,0.32);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: linear-gradient(to bottom, var(--bg1), var(--bg2));
      color: var(--ivory);
      overflow-x:hidden;
    }

    header{
      padding: 20px 12px 12px;
      text-align:center;
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
      background: rgba(8,24,24,0.65);
      border-bottom: 1px solid rgba(212,175,55,0.22);
      z-index: 10;
    }
    h1{
      margin:0;
      color: var(--gold);
      letter-spacing: 1.1px;
      font-size: clamp(18px, 4.6vw, 28px);
    }
    .meta{
      margin-top: 10px;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      border: 1px solid rgba(212,175,55,0.55);
      background: rgba(0,0,0,0.18);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .wrap{
      padding: 10px 10px 72px;
      max-width: 920px;
      margin: 0 auto;
    }

    /* Card */
    .card{
      background: linear-gradient(180deg, var(--card2), var(--card));
      border:1px solid rgba(212,175,55,0.55);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      text-align:center;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
    }
    .card::before{
      content:"✶";
      position:absolute;
      top:-11px;
      left:50%;
      transform:translateX(-50%);
      color: var(--gold);
      font-size: 16px;
      background: rgba(8,24,24,0.95);
      padding: 0 6px;
      border-radius: 10px;
    }
    .name{
      font-weight: 800;
      font-size: 14px;
      line-height: 1.25;
      word-break: break-word;
    }
    .small{
      margin-top: 6px;
      font-size: 12px;
      opacity: .88;
      line-height: 1.35;
      word-break: break-word;
    }

    /* Couple row */
    .couple{
      display:flex;
      gap: 10px;
      align-items: stretch;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .couple .card{ max-width: 360px; }
    .dash{
      display:grid;
      place-items:center;
      color: var(--gold);
      font-size: 20px;
      padding: 0 2px;
      user-select:none;
    }

    .trunk{
      width: 2px;
      height: 22px;
      background: var(--line);
      margin: 12px auto;
      border-radius: 999px;
    }

    /* Sections */
    .children-sections{
      display:flex;
      flex-direction: column;
      gap: 12px;
    }
    .section{
      position: relative;
      padding-left: 16px;
    }
    .section::before{
      content:"";
      position:absolute;
      left: 6px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(212,175,55,0.28);
      border-radius: 999px;
    }
    .dot{
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      position:absolute;
      left: 2px;
      top: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }

    /* Collapsible blocks */
    details{
      border: 1px solid rgba(212,175,55,0.28);
      border-radius: 14px;
      background: rgba(0,0,0,0.12);
      padding: 8px;
    }
    summary{
      cursor:pointer;
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      user-select:none;
    }
    summary::-webkit-details-marker{ display:none; }

    .sum-left{
      display:flex;
      flex-direction:column;
      gap:2px;
      text-align:left;
      min-width: 0;
    }
    .sum-title{
      font-weight:800;
      color: var(--ivory);
      font-size: 13px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 52vw;
    }
    .sum-sub{
      font-size: 11px;
      opacity:.78;
    }
    .sum-right{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      border:1px solid rgba(212,175,55,0.55);
      background: rgba(0,0,0,0.18);
      color: var(--ivory);
      padding: 7px 10px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:800;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }
    .btn:hover{ background: rgba(245,239,225,0.10); }
    .btn.primary{
      background: linear-gradient(180deg, rgba(212,175,55,0.24), rgba(212,175,55,0.12));
      border-color: rgba(212,175,55,0.75);
    }
    .btn.danger{
      border-color: rgba(255,120,120,0.55);
      background: rgba(255,120,120,0.10);
    }

    /* nested children list */
    .kids{
      margin-top: 10px;
      padding-left: 10px;
      display:flex;
      flex-direction: column;
      gap: 8px;
    }
    .kid-line{
      position: relative;
      padding-left: 14px;
    }
    .kid-line::before{
      content:"";
      position:absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(212,175,55,0.24);
      border-radius: 999px;
    }

    footer{
      text-align:center;
      font-size: 12px;
      opacity: .6;
      padding: 18px 12px 36px;
    }

    @media (max-width: 420px){
      .dash{ font-size: 18px; }
      .name{ font-size: 13.5px; }
      .card{ padding: 9px 10px; }
      .wrap{ padding-left: 8px; padding-right: 8px; }
      .sum-title{ max-width: 44vw; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Tuncay Ailesi Soy Ağacı (Almanya)</h1>
    <div class="meta">
      <span class="pill" id="countPill">Toplam üye sayısı: …</span>
      <button class="btn primary" id="resetBtn" type="button">Bu cihazda kaydı sıfırla</button>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <footer>✶ Her yerde kişi / eş / çocuk / ebeveyn ekleyebilirsin ✶</footer>

  <script>
    // ------------------ DEFAULT DATA (DÜZELTİLMİŞ) ------------------

              ]

          ]
        },

        // 2) Hüseyin
        {

          note: "",
          children: [
            {

              ]
            },
            {

              note: "",
              children: [
                { id: "ahsen", person: "Ahsen Bahtiyar", spouse: "", note: "", children: [] },
                { id: "zeynep", person: "Zeynep Bahtiyar", spouse: "", note: "", children: [] }
              ]
            },
            {

        {

          children: [
            {

              note: "",
              children: [
                { id: "fatihE", person: "Fatih Eren Tuncay", spouse: "", note: "", children: [] },
                { id: "asya", person: "Asya Tuncay", spouse: "", note: "", children: [] }
              ]
            },
            {
              id: "ulku",

              spouse: "Ertan Efe",
              note: "",
              children: [
                { id: "hamza", person: "Hamza Ali Efe", spouse: "", note: "", children: [] }
              ]
            },
            {
              id: "ugur",
              person: "Uğur Tuncay",
              spouse: "Tuğba Tuncay Yumuşakgeyle",
              note: "",
              children: []
            },
            {
              id: "hakan",
              person: "Hakan Ali Tuncay",
              spouse: "",
              note: "",
              children: []
            }
          ]
        },

        // 4) Sevda (manuel alanlar bırakıldı)
        {
          id: "sev",
          person: "Sevda Tuncay",
          spouse: "Ahmed Tuncay",
          note: "",
          children: [
            {
              id: "bur",
              person: "Burhan Tuncay",
              spouse: "Adalet Tuncay",
              note: "",
              children: [
                { id: "burc1", person: "— En büyük çocuk (manuel)", spouse: "", note: "", children: [] },
                { id: "mirac", person: "Miraç Ahmed Tuncay", spouse: "", note: "", children: [] }
              ]
            },
            {
              id: "tubaTop",
              person: "Tuba Topal",
              spouse: "Cian Topal",
              note: "",
              children: [
                { id: "malik", person: "Malik Topal", spouse: "", note: "", children: [] }
              ]
            },
            {
              id: "asli",
              person: "Aslı Tuncay",
              spouse: "— (manuel girilecek)",
              note: "",
              children: [
                { id: "aslic1", person: "— Çocuk (manuel)", spouse: "", note: "", children: [] }
              ]
            }
          ]
        },

        // 5) Cemal (düzeltildi)
        {
          id: "cemal",
          person: "Cemal Tuncay",
          spouse: "Agnieszka Tuncay",
          note: "",
          children: [
            { id: "lara", person: "Lara Tuncay", spouse: "", note: "", children: [] }
          ]
        },

        // 6) Fatih (düzeltildi)
        {
          id: "fatih",
          person: "Fatih Tuncay",
          spouse: "Tatjana Tuncay",
          note: "Boşanmış",
          children: [
            { id: "senay", person: "Şenay Tuncay", spouse: "", note: "", children: [] },
            { id: "cemalf", person: "Cemal Tuncay", spouse: "", note: "", children: [] },
            { id: "esra", person: "Esra Tuncay", spouse: "", note: "", children: [] },
            { id: "sami", person: "Sami Yusuf Tuncay", spouse: "", note: "", children: [] }
          ]
        }
      ]
    };

    // ------------------ STORAGE ------------------
    const STORAGE_KEY = "tuncay_family_de_v2_full";

    function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

    function loadTree(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return clone(DEFAULT_TREE);
        return JSON.parse(raw);
      }catch(e){
        return clone(DEFAULT_TREE);
      }
    }
    function saveTree(tree){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tree));
    }

    // ------------------ HELPERS ------------------
    function isRealName(name){
      if(!name) return false;
      const t = String(name).trim();
      if(!t) return false;
      if(t.startsWith("—")) return false;
      return true;
    }
    function countMembers(node){
      let c = 0;
      if(isRealName(node.person)) c++;
      if(isRealName(node.spouse)) c++;
      for(const ch of (node.children || [])) c += countMembers(ch);
      return c;
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function newId(){
      return "id_" + Math.random().toString(16).slice(2);
    }

    // Find node + parent
    function findNodeAndParent(node, id, parent=null){
      if(node.id === id) return { node, parent };
      for(const ch of (node.children || [])){
        const found = findNodeAndParent(ch, id, node);
        if(found) return found;
      }
      return null;
    }

    function nodeSummary(node){
      const p = (node.person || "").trim() || "(isimsiz)";
      const s = (node.spouse || "").trim();
      const n = (node.note || "").trim();
      let line = p;
      if(s) line += " — " + s;
      if(n) line += " · " + n;
      return line;
    }

    function renderCoupleHTML(person, spouse, note){
      const hasSpouse = Boolean((spouse || "").trim());
      const hasNote = Boolean((note || "").trim());

      if(hasSpouse){
        return `
          <div class="couple">
            <div class="card">
              <div class="name">${escapeHtml(person || "")}</div>
              ${hasNote ? `<div class="small">${escapeHtml(note)}</div>` : ""}
            </div>
            <div class="dash">—</div>
            <div class="card">
              <div class="name">${escapeHtml(spouse || "")}</div>
              <div class="small">Eşi</div>
            </div>
          </div>
        `;
      }

      return `
        <div class="card">
          <div class="name">${escapeHtml(person || "")}</div>
          ${hasNote ? `<div class="small">${escapeHtml(note)}</div>` : ""}
        </div>
      `;
    }

    // ------------------ ACTIONS (EVERYWHERE) ------------------
    function editNode(tree, id){
      const found = findNodeAndParent(tree, id);
      if(!found) return;

      const node = found.node;

      const p = prompt("Kişi adı (person):", node.person ?? "");
      if(p === null) return;

      const s = prompt("Eş adı (spouse) — boş bırakabilirsin:", node.spouse ?? "");
      if(s === null) return;

      const n = prompt("Not (örn. Boşanmış) — boş bırakabilirsin:", node.note ?? "");
      if(n === null) return;

      node.person = p;
      node.spouse = s;
      node.note = n;

      saveTree(tree);
      render(tree);
    }

    function addSpouse(tree, id){
      const found = findNodeAndParent(tree, id);
      if(!found) return;
      const node = found.node;

      const s = prompt("Eş adı (spouse):", node.spouse ?? "");
      if(s === null) return;

      node.spouse = s;
      saveTree(tree);
      render(tree);
    }

    function addChild(tree, parentId){
      const found = findNodeAndParent(tree, parentId);
      if(!found) return;

      const parent = found.node;
      parent.children = parent.children || [];
      parent.children.push({
        id: newId(),
        person: "— Yeni kişi (manuel)",
        spouse: "",
        note: "",
        children: []
      });

      saveTree(tree);
      render(tree);
    }

    // Add parents ABOVE a node anywhere:
    // Creates a new parent node and replaces target node in its parent's children list.
    // New parents -> children: [targetNode]
    function addParentsAbove(tree, id){
      const found = findNodeAndParent(tree, id);
      if(!found) return;

      // if this is root, make new root
      const target = found.node;
      const parent = found.parent;

      const parentPerson = prompt("Ebeveyn (anne/baba) kişi adı:", "— Yeni ebeveyn (manuel)");
      if(parentPerson === null) return;

      const parentSpouse = prompt("Diğer ebeveyn / eş adı (opsiyonel):", "");
      if(parentSpouse === null) return;

      const wrapper = {
        id: newId(),
        person: parentPerson,
        spouse: parentSpouse,
        note: "",
        children: [ target ]
      };

      if(!parent){
        // target is root -> wrapper becomes new root
        tree = wrapper;
      }else{
        // replace target in parent's children
        parent.children = parent.children || [];
        const idx = parent.children.findIndex(x => x.id === target.id);
        if(idx >= 0) parent.children[idx] = wrapper;
      }

      saveTree(tree);
      render(tree);
    }

    function deleteNode(tree, id){
      const found = findNodeAndParent(tree, id);
      if(!found) return;

      const parent = found.parent;
      const node = found.node;

      if(!parent){
        alert("Kök kişi silinemez. (İstersen ‘Ebeveyn ekle’ ile üstüne yeni kök koyabilirsin.)");
        return;
      }

      const ok = confirm(`Silinsin mi?\n${nodeSummary(node)}\n\nBu kişinin tüm alt dalları da silinir.`);
      if(!ok) return;

      parent.children = (parent.children || []).filter(ch => ch.id !== id);

      saveTree(tree);
      render(tree);
    }

    // ------------------ RENDER ------------------
    function renderNode(node, label){
      const hasChildren = (node.children || []).length > 0;

      return `
        <section class="section">
          <span class="dot" aria-hidden="true"></span>

          <details open>
            <summary>
              <div class="sum-left">
                <div class="sum-title">${escapeHtml(nodeSummary(node))}</div>
                <div class="sum-sub">${escapeHtml(label)} · ${hasChildren ? `${node.children.length} çocuk/alt dal` : "Alt dal yok"}</div>
              </div>
              <div class="sum-right">
                <button class="btn" type="button" data-action="edit" data-id="${node.id}">✎ Düzenle</button>
                <button class="btn" type="button" data-action="spouse" data-id="${node.id}">+ Eş</button>
                <button class="btn primary" type="button" data-action="add" data-id="${node.id}">+ Çocuk</button>
                <button class="btn" type="button" data-action="parents" data-id="${node.id}">+ Ebeveyn</button>
                <button class="btn danger" type="button" data-action="del" data-id="${node.id}">🗑 Sil</button>
              </div>
            </summary>

            <div style="padding:10px 6px 6px;">
              ${renderCoupleHTML(node.person, node.spouse, node.note)}

              ${hasChildren ? `
                <div class="kids">
                  ${(node.children || []).map(ch => `
                    <div class="kid-line">
                      ${renderNode(ch, "Alt Nesil")}
                    </div>
                  `).join("")}
                </div>
              ` : ""}
            </div>
          </details>
        </section>
      `;
    }

    function render(tree){
      const app = document.getElementById("app");
      const count = countMembers(tree);
      document.getElementById("countPill").textContent = `Toplam üye sayısı: ${count}`;

      // Root always visible
      app.innerHTML = `
        ${renderCoupleHTML(tree.person, tree.spouse, tree.note)}
        <div class="trunk"></div>

        <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin: 0 0 10px;">
          <button class="btn" type="button" data-action="edit" data-id="${tree.id}">✎ Düzenle (Kök)</button>
          <button class="btn" type="button" data-action="spouse" data-id="${tree.id}">+ Eş (Kök)</button>
          <button class="btn primary" type="button" data-action="add" data-id="${tree.id}">+ Çocuk (Kök)</button>
          <button class="btn" type="button" data-action="parents" data-id="${tree.id}">+ Ebeveyn (Kök)</button>
        </div>

        <div class="children-sections">
          ${(tree.children || []).map(ch => renderNode(ch, "1. Nesil Çocuk")).join("")}
        </div>
      `;

      // bind buttons
      app.querySelectorAll("button[data-action]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();

          const action = btn.dataset.action;
          const id = btn.dataset.id;

          let currentTree = loadTree();

          if(action === "edit") editNode(currentTree, id);
          if(action === "spouse") addSpouse(currentTree, id);
          if(action === "add") addChild(currentTree, id);
          if(action === "parents") addParentsAbove(currentTree, id);
          if(action === "del") deleteNode(currentTree, id);
        });
      });
    }

    // ------------------ INIT ------------------
    let TREE = loadTree();
    render(TREE);

    document.getElementById("resetBtn").addEventListener("click", () => {
      if(confirm("Bu cihazdaki kaydedilen değişiklikler sıfırlansın mı?")){
        localStorage.removeItem(STORAGE_KEY);
        TREE = loadTree();
        render(TREE);
      }
    });
  </script>
</body>
</html>
